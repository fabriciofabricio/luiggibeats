      <circle cx="90" cy="84" r="2.8600000000000003" fill="#111"/>
      <circle cx="130" cy="84" r="2.8600000000000003" fill="#111"/>
      <circle cx="87" cy="80.5" r="2.2" fill="#FFF"/>
      <circle cx="127" cy="80.5" r="2.2" fill="#FFF"/>
