        <rect x="97" y="128" width="26" height="5" rx="2" fill="#18181B" stroke="#16161B" stroke-width="1.5"/><path d="M110 133 L110 144 M106 137 L114 137" stroke="#E5E7EB" stroke-width="2"/></g>
