<svg xmlns="http://www.w3.org/2000/svg" viewBox="26 14 168 168" class="luiggi-rig-svg" data-char="dominik" data-expr="neutro">
      <g class="rig-root" transform="translate(110,285) scale(0.975) translate(-110,-285)">
        
        <!-- 1. Cabelo trás -->
        <g class="rig-hair-back">
      <ellipse cx="110" cy="72" rx="52" ry="44" fill="#2A211D" stroke="#16161B" stroke-width="2.8"/>
    </g>
        <!-- 2. Pernas -->
        <g class="rig-legs"></g>
        <!-- Pescoço -->
        <rect x="99" y="122" width="22" height="22" rx="6" fill="#C99B84" stroke="#16161B" stroke-width="2.8"/>
        <!-- 3. Tronco -->
        <g class="rig-torso">
        <path d="M79 142 Q110 132 141 142 L139 214 L81 214 Z"
          fill="#7C3AED" stroke="#16161B" stroke-width="2.8" stroke-linejoin="round"/>
      
        <line x1="110" y1="144" x2="110" y2="213" stroke="#5729a6" stroke-width="2.4"/>
      </g>
        <!-- 4. Braços -->
        <g class="rig-arms">
      <g class="rig-arm-l">
        <rect x="69" y="143" width="12" height="44" rx="6" fill="#7C3AED" stroke="#16161B" stroke-width="2.8"/>
        <circle cx="75" cy="192" r="6.5" fill="#E8BEA7" stroke="#16161B" stroke-width="2.8"/>
      </g>
      <g class="rig-arm-r">
        <rect x="139" y="143" width="12" height="44" rx="6" fill="#7C3AED" stroke="#16161B" stroke-width="2.8"/>
        <circle cx="145" cy="192" r="6.5" fill="#E8BEA7" stroke="#16161B" stroke-width="2.8"/>
      </g>
      
    </g>
        <!-- 5, 6, 7, 8. Cabeça, olhos, sobrancelhas, boca -->
        <g class="rig-head">
        <!-- Orelhas -->
        <circle cx="64" cy="86" r="8" fill="#C99B84" stroke="#16161B" stroke-width="2.8"/>
        <circle cx="156" cy="86" r="8" fill="#C99B84" stroke="#16161B" stroke-width="2.8"/>
        <!-- Rosto cartoon (1/3 da altura do corpo!) -->
        <rect x="65" y="34" width="90" height="96" rx="44" fill="#E8BEA7" stroke="#16161B" stroke-width="2.8"/>
        <!-- Sombra suave de queixo -->
        <path d="M74 114 Q110 132 146 114 Q110 125 74 114 Z" fill="#C99B84" opacity="0.55"/>
        <!-- Nariz -->
        <path d="M108 88 Q114 95 107 97" fill="none" stroke="#C99B84" stroke-width="2.4" stroke-linecap="round"/>
        <!-- Blush -->
        
        
        <g class="rig-eyes">
      
      <ellipse cx="90" cy="84" rx="10.5" ry="9.5" fill="#FFFFFF" stroke="#16161B" stroke-width="2.2"/>
      <ellipse cx="130" cy="84" rx="10.5" ry="9.5" fill="#FFFFFF" stroke="#16161B" stroke-width="2.2"/>
      <circle cx="90" cy="84" r="5.5" fill="#3B2B23"/>
      <circle cx="130" cy="84" r="5.5" fill="#3B2B23"/>
      <circle cx="90" cy="84" r="2.8600000000000003" fill="#111"/>
      <circle cx="130" cy="84" r="2.8600000000000003" fill="#111"/>
      <circle cx="87" cy="80.5" r="2.2" fill="#FFF"/>
      <circle cx="127" cy="80.5" r="2.2" fill="#FFF"/>
    </g>
        <g class="rig-brows">
      <path d="M78 70 Q90 66 100 70" fill="none" stroke="#2A211D" stroke-width="3.2" stroke-linecap="round"/>
      <path d="M120 70 Q130 66 142 70" fill="none" stroke="#2A211D" stroke-width="3.2" stroke-linecap="round"/>
    </g>
        <g class="rig-mouth">
      <path d="M100 109 Q110 115 120 109" fill="none" stroke="#16161B" stroke-width="2.6" stroke-linecap="round"/>
    </g>
      </g>
        <!-- 9. Cabelo frente -->
        <g class="rig-hair-front">
        <path d="M58 76 Q58 34 84 26 L94 36 L112 20 L124 34 L144 26 Q162 42 162 76 Q140 50 110 52 Q80 50 58 76 Z"
          fill="#2A211D" stroke="#16161B" stroke-width="2.8" stroke-linejoin="round"/>
      </g>
        <!-- 10. Acessórios -->
        <g class="rig-accessories"></g>
      </g>
    </svg>